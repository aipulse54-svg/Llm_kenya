# Josh Kenya LLM Configuration
model:
  name: "josh_kenya"
  model_type: "gpt"
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 2048
  vocab_size: 50257
  dropout: 0.1
  attention_dropout: 0.1
  
training:
  batch_size: 32
  learning_rate: 5e-4
  num_epochs: 3
  warmup_steps: 1000
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  weight_decay: 0.01
  num_workers: 4
  
dataset:
  name: "wikitext"
  config: "wikitext-2"
  max_seq_length: 2048
  split: "train"
  
inference:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.2
  
conversation:
  memory_size: 10
  context_window: 4096
  
system:
  device: "cuda"
  precision: "float32"
  checkpoint_dir: "checkpoints"
  model_save_dir: "models"
